<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 微信分享 meta 标签 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="尚尚我爱你">
  <meta property="og:description" content="尚尚我爱你 - 浪漫的爱心粒子特效">
  <meta property="og:type" content="website">
  <title>尚尚我爱你</title>
  <style>
    /* ============================================================
       全屏黑色背景，Canvas 铺满全屏
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* ============================================================
       顶部标题文字
       ============================================================ */
    #love-title {
      position: fixed;
      top: 40px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 20;
      pointer-events: none;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'STKaiti', 'KaiTi', sans-serif;
      /* 粉红渐变文字 */
      background: linear-gradient(135deg, #ff4d6d, #ff6b8a, #f72585, #ff9e00);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      /* 发光阴影 */
      text-shadow: none;
      filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.6))
               drop-shadow(0 0 20px rgba(255, 77, 109, 0.3));
      /* 入场动画 */
      animation: titleFadeIn 1.5s ease-out;
    }

    @keyframes titleFadeIn {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 手机端适配 */
    @media screen and (max-width: 430px) {
      #love-title {
        top: 30px;
        font-size: 22px;
        letter-spacing: 3px;
      }
    }

    /* ============================================================
       加载提示层
       ============================================================ */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      color: #ff6b8a;
      font-size: 16px;
      letter-spacing: 2px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* 加载动画点 */
    .loading-dots {
      margin-top: 12px;
    }
    .loading-dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4d6d;
      margin: 0 4px;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* ============================================================
       底部提示
       ============================================================ */
    #hint-text {
      position: fixed;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      letter-spacing: 1px;
      z-index: 10;
      pointer-events: none;
      padding: 0 20px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    @media screen and (max-width: 430px) {
      #hint-text { bottom: 40px; font-size: 11px; }
      .loading-text { font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- 加载层 -->
  <div id="loading-overlay">
    <div class="loading-text">爱心特效加载中</div>
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- 顶部标题 -->
  <div id="love-title">尚尚我爱你</div>

  <!-- Canvas 画布 -->
  <canvas id="heartCanvas"></canvas>

  <!-- 底部提示 -->
  <div id="hint-text">点击屏幕触发爱心粒子爆发</div>

  <script>
  (function() {
    'use strict';

    /* ============================================================
       【可调参数区域】—— 所有参数集中在此，修改后刷新即可看到效果
       ============================================================ */

    // 粒子数量（桌面端）。值越大爱心越密集，也更消耗性能
    var PARTICLE_COUNT_DESKTOP = 500;

    // 粒子数量（移动端）。移动端性能较弱，适当降低
    var PARTICLE_COUNT_MOBILE = 200;

    // 每个粒子的生命周期（秒），值越大粒子飘得越远
    var PARTICLE_DURATION = 2;

    // 粒子初速度（像素/秒），值越大粒子扩散越快
    var PARTICLE_VELOCITY = 100;

    // 粒子加速度系数（负数向内聚拢，正数向外扩散，推荐 -0.75）
    var PARTICLE_EFFECT = -0.75;

    // 粒子图片的基础大小（像素），爱心图标的参考尺寸
    var PARTICLE_SIZE = 30;

    // 爱心相对于画布的缩放比例（1.0 = 填满画布的紧凑尺寸）
    var HEART_SCALE = 1.0;

    // 点击/触摸爆发时额外释放的粒子波数
    var BURST_WAVE_COUNT = 3;

    // 爆发波间隔（毫秒）
    var BURST_WAVE_INTERVAL = 80;

    // 每波爆发释放的粒子数
    var BURST_PARTICLES_PER_WAVE = 30;

    // 爆发时粒子扩散速度倍数
    var BURST_VELOCITY_MULTIPLIER = 2.5;

    // 粒子颜色（红/粉/紫/橙/浅蓝五色系）
    var PARTICLE_COLORS = [
      '#ff4d6d', // 亮红
      '#ff0a54', // 深红
      '#ff6b8a', // 粉红
      '#ff85a1', // 浅粉
      '#f72585', // 品红
      '#b5179e', // 紫红
      '#ff9e00', // 橙色
      '#00b4d8'  // 浅蓝
    ];

    // ============================================================
    // 运行时变量
    // ============================================================

    var canvas = document.getElementById('heartCanvas');
    var ctx = canvas.getContext('2d');
    var loadingOverlay = document.getElementById('loading-overlay');

    // 设备检测
    var isMobile = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i)
      .test((navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase());

    // 根据设备选择粒子数量
    var particleCount = isMobile ? PARTICLE_COUNT_MOBILE : PARTICLE_COUNT_DESKTOP;

    // 设备像素比（高清屏适配）
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    // 画布逻辑尺寸和物理尺寸
    var canvasWidth, canvasHeight;

    // 爱心中心坐标
    var heartCenterX, heartCenterY;

    // 心形曲线的缩放基数
    var heartScaleBase;

    // 粒子图片数组（每种颜色一个离屏 Canvas）
    var heartImages = [];

    // 预计算的爱心曲线点集
    var heartCurvePoints = [];

    // ============================================================
    // 检测 requestAnimationFrame 并做兼容处理（ES5 polyfill）
    // ============================================================
    (function() {
      var b = 0;
      var vendors = ['ms', 'moz', 'webkit', 'o'];
      for (var a = 0; a < vendors.length && !window.requestAnimationFrame; ++a) {
        window.requestAnimationFrame = window[vendors[a] + 'RequestAnimationFrame'];
        window.cancelAnimationFrame =
          window[vendors[a] + 'CancelAnimationFrame'] ||
          window[vendors[a] + 'CancelRequestAnimationFrame'];
      }
      if (!window.requestAnimationFrame) {
        window.requestAnimationFrame = function(callback) {
          var d = new Date().getTime();
          var f = Math.max(0, 16 - (d - b));
          var g = window.setTimeout(function() { callback(d + f); }, f);
          b = d + f;
          return g;
        };
      }
      if (!window.cancelAnimationFrame) {
        window.cancelAnimationFrame = function(id) { clearTimeout(id); };
      }
    })();

    // ============================================================
    // Point 类：二维向量
    // ============================================================
    var Point = (function() {
      function Point(x, y) {
        this.x = (typeof x !== 'undefined') ? x : 0;
        this.y = (typeof y !== 'undefined') ? y : 0;
      }
      Point.prototype.clone = function() {
        return new Point(this.x, this.y);
      };
      Point.prototype.length = function(len) {
        if (typeof len === 'undefined') {
          return Math.sqrt(this.x * this.x + this.y * this.y);
        }
        this.normalize();
        this.x *= len;
        this.y *= len;
        return this;
      };
      Point.prototype.normalize = function() {
        var len = this.length();
        if (len > 0) {
          this.x /= len;
          this.y /= len;
        }
        return this;
      };
      return Point;
    })();

    // ============================================================
    // Particle 类：单个粒子
    // ============================================================
    var Particle = (function() {
      function Particle() {
        this.position = new Point();
        this.velocity = new Point();
        this.acceleration = new Point();
        this.age = 0;
        this.colorIndex = 0;
        this.baseSize = PARTICLE_SIZE;
      }
      Particle.prototype.initialize = function(x, y, dx, dy, colorIdx, burstMode) {
        this.position.x = x;
        this.position.y = y;
        this.velocity.x = dx;
        this.velocity.y = dy;
        // 爆发模式：加速度更大，粒子扩散更猛烈
        var effect = burstMode ? PARTICLE_EFFECT * 2 : PARTICLE_EFFECT;
        this.acceleration.x = dx * effect;
        this.acceleration.y = dy * effect;
        this.age = 0;
        this.colorIndex = colorIdx;
      };
      Particle.prototype.update = function(deltaTime) {
        this.position.x += this.velocity.x * deltaTime;
        this.position.y += this.velocity.y * deltaTime;
        this.velocity.x += this.acceleration.x * deltaTime;
        this.velocity.y += this.acceleration.y * deltaTime;
        this.age += deltaTime;
      };
      Particle.prototype.draw = function(context) {
        // 缓出函数：让粒子先快后慢，更自然
        var t = this.age / PARTICLE_DURATION;
        function ease(t) { return (--t) * t * t + 1; }
        var easedT = ease(Math.min(t, 1));

        // 选择对应颜色的爱心图片
        var img = heartImages[this.colorIndex % heartImages.length];
        var size = img.width * easedT;

        // 透明度：随年龄线性降低
        var alpha = 1 - t;
        if (alpha < 0) alpha = 0;
        if (alpha > 1) alpha = 1;

        context.globalAlpha = alpha;
        context.drawImage(
          img,
          this.position.x - size / 2,
          this.position.y - size / 2,
          size,
          size
        );
      };
      return Particle;
    })();

    // ============================================================
    // ParticlePool 类：粒子对象池（环形队列，避免频繁创建销毁）
    // ============================================================
    var ParticlePool = (function() {
      var particles, firstActive, firstFree, duration;

      function ParticlePool(length) {
        particles = new Array(length);
        for (var i = 0; i < particles.length; i++) {
          particles[i] = new Particle();
        }
        firstActive = 0;
        firstFree = 0;
        duration = PARTICLE_DURATION;
      }

      // 添加一个粒子到池中
      ParticlePool.prototype.add = function(x, y, dx, dy, colorIdx, burstMode) {
        particles[firstFree].initialize(x, y, dx, dy, colorIdx, burstMode);
        // 环形队列推进
        firstFree++;
        if (firstFree === particles.length) firstFree = 0;
        if (firstActive === firstFree) firstActive++;
        if (firstActive === particles.length) firstActive = 0;
      };

      // 更新所有活跃粒子
      ParticlePool.prototype.update = function(deltaTime) {
        var i;

        // 情况1：活跃区间是连续的一段 [firstActive, firstFree)
        if (firstActive < firstFree) {
          for (i = firstActive; i < firstFree; i++) {
            particles[i].update(deltaTime);
          }
        }
        // 情况2：活跃区间跨越数组末尾 [firstActive, end) + [0, firstFree)
        if (firstFree < firstActive) {
          for (i = firstActive; i < particles.length; i++) {
            particles[i].update(deltaTime);
          }
          for (i = 0; i < firstFree; i++) {
            particles[i].update(deltaTime);
          }
        }

        // 移除过期粒子（age >= duration）
        while (
          particles[firstActive].age >= duration &&
          firstActive !== firstFree
        ) {
          firstActive++;
          if (firstActive === particles.length) firstActive = 0;
        }
      };

      // 绘制所有活跃粒子
      ParticlePool.prototype.draw = function(context) {
        var i;

        if (firstActive < firstFree) {
          for (i = firstActive; i < firstFree; i++) {
            particles[i].draw(context);
          }
        }
        if (firstFree < firstActive) {
          for (i = firstActive; i < particles.length; i++) {
            particles[i].draw(context);
          }
          for (i = 0; i < firstFree; i++) {
            particles[i].draw(context);
          }
        }
      };

      return ParticlePool;
    })();

    // 全局粒子池实例
    var pool;

    // ============================================================
    // 心形曲线计算
    // 使用经典参数方程：
    //   x(t) = 16 * sin³(t)
    //   y(t) = 13*cos(t) - 5*cos(2t) - 2*cos(3t) - cos(4t)
    // t 从 0 到 2π
    // ============================================================
    function generateHeartCurve(scale, centerX, centerY) {
      var points = [];
      var step = 0.005; // 步长越小，曲线越细腻
      for (var t = 0; t < Math.PI * 2; t += step) {
        var x = 16 * Math.pow(Math.sin(t), 3);
        var y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        points.push({
          x: x * scale + centerX,
          y: y * scale + centerY
        });
      }
      return points;
    }

    /**
     * 从心形曲线上随机取一个点
     */
    function randomHeartPoint() {
      var idx = Math.floor(Math.random() * heartCurvePoints.length);
      return heartCurvePoints[idx];
    }

    /**
     * 生成一个随机方向的速度向量
     */
    function randomVelocity(speed) {
      var angle = Math.random() * Math.PI * 2;
      return {
        dx: Math.cos(angle) * speed * (0.5 + Math.random() * 0.5),
        dy: Math.sin(angle) * speed * (0.5 + Math.random() * 0.5)
      };
    }

    // ============================================================
    // 创建粒子图片（离屏 Canvas 绘制爱心）
    // ============================================================
    function createHeartImage(size, color) {
      var offCanvas = document.createElement('canvas');
      offCanvas.width = size;
      offCanvas.height = size;
      var offCtx = offCanvas.getContext('2d');

      var half = size / 2;
      // 用贝塞尔曲线绘制爱心形状
      offCtx.beginPath();
      offCtx.moveTo(half, size * 0.25);
      // 左半心形曲线
      offCtx.bezierCurveTo(half, 0, 0, 0, 0, half * 0.6);
      offCtx.bezierCurveTo(0, size * 0.9, half * 0.4, size, half, size);
      // 右半心形曲线
      offCtx.bezierCurveTo(half * 1.6, size, size, size * 0.9, size, half * 0.6);
      offCtx.bezierCurveTo(size, 0, half, 0, half, size * 0.25);
      offCtx.closePath();

      offCtx.fillStyle = color;
      offCtx.fill();

      return offCanvas;
    }

    // ============================================================
    // Canvas 尺寸调整
    // ============================================================
    function resizeCanvas() {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;

      // 设置 Canvas 物理像素尺寸（适配高清屏）
      canvas.width = canvasWidth * dpr;
      canvas.height = canvasHeight * dpr;
      canvas.style.width = canvasWidth + 'px';
      canvas.style.height = canvasHeight + 'px';

      // 缩放上下文以适配物理像素
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      // 更新爱心中心和缩放
      heartCenterX = canvasWidth / 2;
      heartCenterY = canvasHeight / 2;

      // 心形曲线缩放：根据画布短边计算，让爱心占画布的合理比例
      var minDim = Math.min(canvasWidth, canvasHeight);
      heartScaleBase = minDim * 0.028 * HEART_SCALE;

      // 重新生成心形曲线点集
      heartCurvePoints = generateHeartCurve(heartScaleBase, heartCenterX, heartCenterY);

      // 重新创建粒子图片（每种颜色一个）
      heartImages = [];
      for (var ci = 0; ci < PARTICLE_COLORS.length; ci++) {
        heartImages.push(createHeartImage(PARTICLE_SIZE, PARTICLE_COLORS[ci]));
      }
    }

    // ============================================================
    // 每帧发射新粒子（沿心形曲线随机生成）
    // ============================================================
    function emitParticles(count, burstMode) {
      var speedBase = burstMode ? PARTICLE_VELOCITY * BURST_VELOCITY_MULTIPLIER : PARTICLE_VELOCITY;
      for (var i = 0; i < count; i++) {
        var pt = randomHeartPoint();
        var vel = randomVelocity(speedBase);
        var colorIdx = Math.floor(Math.random() * PARTICLE_COLORS.length);
        pool.add(pt.x, pt.y, vel.dx, vel.dy, colorIdx, burstMode);
      }
    }

    // ============================================================
    // 爆发效果：快速连续释放多波粒子
    // ============================================================
    var burstTimer = null;
    var burstWaveRemaining = 0;

    function triggerBurst() {
      // 清除之前的爆发计时器（如果还在进行中）
      if (burstTimer) {
        clearInterval(burstTimer);
        burstTimer = null;
      }
      burstWaveRemaining = BURST_WAVE_COUNT;

      // 立即释放第一波
      emitParticles(BURST_PARTICLES_PER_WAVE, true);

      // 后续波次
      burstTimer = setInterval(function() {
        burstWaveRemaining--;
        if (burstWaveRemaining <= 0) {
          clearInterval(burstTimer);
          burstTimer = null;
          return;
        }
        emitParticles(BURST_PARTICLES_PER_WAVE, true);
      }, BURST_WAVE_INTERVAL);
    }

    // ============================================================
    // 动画主循环
    // ============================================================
    var lastTime = 0;
    var frameCount = 0;

    function animate(timestamp) {
      // 计算帧间隔时间（秒），处理首帧和时间跳变
      if (!lastTime) lastTime = timestamp;
      var deltaTime = (timestamp - lastTime) / 1000;
      // 防止大帧间隔（如切标签页回来）导致粒子瞬移
      if (deltaTime > 0.1) deltaTime = 0.016;
      lastTime = timestamp;

      // 清空画布
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // 每帧发射恒定数量的新粒子（维持爱心密度）
      var emitPerFrame = Math.round(particleCount / 60);
      if (emitPerFrame < 1) emitPerFrame = 1;
      emitParticles(emitPerFrame, false);

      // 更新和绘制所有粒子
      pool.update(deltaTime);
      pool.draw(ctx);

      // 继续下一帧
      requestAnimationFrame(animate);
    }

    // ============================================================
    // 事件处理
    // ============================================================

    // 点击事件（桌面端）
    function onClick(e) {
      triggerBurst();
    }

    // 触摸事件（移动端）
    function onTouchEnd(e) {
      triggerBurst();
    }

    // 窗口大小改变
    function onResize() {
      resizeCanvas();
      // 重建粒子池以适应新的粒子数量
      pool = new ParticlePool(particleCount);
    }

    function bindEvents() {
      document.addEventListener('click', onClick);
      document.addEventListener('touchend', onTouchEnd);
      window.addEventListener('resize', onResize);
      // 设备方向变化也触发 resize
      window.addEventListener('orientationchange', function() {
        setTimeout(onResize, 200);
      });
    }

    // ============================================================
    // 初始化
    // ============================================================
    function init() {
      resizeCanvas();
      pool = new ParticlePool(particleCount);
      bindEvents();

      // 启动动画
      lastTime = 0;
      requestAnimationFrame(animate);

      // 隐藏加载层
      loadingOverlay.classList.add('hidden');
      setTimeout(function() {
        if (loadingOverlay.parentNode) {
          loadingOverlay.parentNode.removeChild(loadingOverlay);
        }
      }, 600);
    }

    // DOM 加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>

  <!--
  ============================================================
  微信分享部署指南
  ============================================================

  本文件是纯静态 HTML 单文件，可部署到任意静态托管平台。

  【方式一：GitHub Pages（免费）】
  1. 注册 GitHub → 新建仓库 heart-particle（Public）
  2. 将本文件重命名为 index.html 上传到仓库根目录
  3. Settings → Pages → Source 选 main 分支 → Save
  4. 获得链接 https://用户名.github.io/heart-particle/
  5. 直接发给微信朋友即可

  【方式二：Vercel（免费，国内速度好）】
  1. 用 GitHub 登录 vercel.com
  2. Import 上面的 GitHub 仓库 → Deploy
